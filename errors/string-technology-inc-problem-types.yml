  title: Bad Request
  meaning: The request was malformed or missing required fields (e.g. an invalid quote or payment payload).
  source_operation: post_transaction
- status: 401
  title: Unauthorized
  meaning: Missing or invalid authentication — a bad/absent X-Api-Key or an unauthenticated player session.
  source_operation: post_transaction
- status: 403
  title: Forbidden
  meaning: Authenticated but not permitted for this resource/action (e.g. wrong key class or organization scope).
  source_operation: post_transaction
- status: 404
  title: Not Found
  meaning: The referenced resource (contract, platform, member, user, invite) does not exist.
  source_operation: get_contracts-id
- status: 500
  title: Internal Server Error
  meaning: An unexpected server-side failure while processing the request/transaction.
