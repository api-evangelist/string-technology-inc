description: >-
  API-level error catalog for the String API. Derived from the documented HTTP
  response codes on the transaction/quote and management endpoints (the public
  ReadMe reference lists 200/400/401/403/500 on the transact operation). No
  machine-readable OpenAPI is publicly retrievable, and String does not publish
  an RFC 9457 problem+json envelope, so these are captured as HTTP status
  classes rather than typed problem URIs. Payment-processor decline codes are
  handled by String as merchant of record and are not published in the
  developer docs, so no decline-codes artifact is emitted (no fabrication).
problems:
