aid: string-technology-inc
name: String Technology Inc
description: >-
  String (string.xyz) is a fiat interoperability platform for Web3 gaming,
  operated by String Technology Inc and backed by 500 Global. String lets game
  developers accept credit-card and bank payments natively inside their games,
  acting as the merchant of record and counterparty for fiat on/off ramps, NFT
  purchases, and cross-chain payments. A player pays fiat on traditional rails
  and String delivers the digital asset on-chain — either by interacting with
  the game's smart contract to mint/send an NFT or by sending a token from its
  treasury to the player's wallet. String ships three integration surfaces —
  String Checkout (drop-in payment app), a Unity SDK, and String Direct (custom
  web SDK) — all wrapping a REST API at string-api.xyz that covers API keys,
  contracts, platforms (games), members, organizations, users (players), saved
  cards, wallet-signature login, quotes, and transactions.
